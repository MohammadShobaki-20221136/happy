<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Sentiment Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header id="navbar"></header>

    <main>
        <div id="flash" class="flash"></div>

        <div class="card">
            <h1>Profile</h1>
            <p><strong>Name:</strong> <span id="profile-name"></span></p>
            <p><strong>Email:</strong> <span id="profile-email"></span></p>
            <p><strong>Member since:</strong> <span id="profile-created"></span></p>
            <p><strong>Last login:</strong> <span id="profile-last-login"></span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="stat-total">0</div>
                <div class="label">Total Analyses</div>
            </div>
            <div class="stat-card">
                <div class="value" id="stat-common">-</div>
                <div class="label">Most Common Sentiment</div>
            </div>
            <!--<div class="stat-card">
                <div class="value"><span id="stat-confidence">0</span>%</div>
                <div class="label">Average Confidence</div>
            </div> -->
        </div>

        <div class="card">
            <h1>Analysis History</h1>

            <table id="history-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Text</th>
                        <th>Sentiment</th>
                        <!--<th>Confidence</th>-->
                        <th></th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>

            <p class="empty-state" id="empty-msg" style="display: none;">
                No analyses yet. <a href="/analyze">Analyze some text</a> to get started.
            </p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='profile.js') }}"></script>
</body>
</html>
